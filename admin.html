
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #eef2ff;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
}

.login-box {
  background: white;
  width: 100%;
  max-width: 380px;
  padding: 30px;
  border-radius: 16px;
  box-shadow: 0 5px 25px #0002;
}

h2 {
  text-align: center;
  color: #172554;
}

p {
  text-align: center;
  color: #64748b;
}

input {
  width: 100%;
  padding: 13px;
  margin: 10px 0;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
}

button {
  width: 100%;
  padding: 13px;
  margin-top: 15px;
  border: none;
  border-radius: 8px;
  background: #2563eb;
  color: white;
  font-size: 16px;
}

</style>
</head>

<body>

<div class="login-box">

<h2>Admin Login</h2>
<p>International eSIM Dashboard</p>

<input type="email" id="email"
placeholder="Admin Email">

<input type="password" id="password"
placeholder="Password">

<button onclick="adminLogin()">Login</button>

<p id="message"></p>

</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <script>
const firebaseConfig = {
  apiKey: "AIzaSyARl16kTrSueEzj_CGdL2jlmg2k6_bXvUs",
  authDomain: "international-esim.firebaseapp.com",
  projectId: "international-esim",
  storageBucket: "international-esim.firebasestorage.app",
  messagingSenderId: "436978177904",
  appId: "1:436978177904:web:7f4bf60b14dad96e0321b5",
  measurementId: "G-9LL2FJL671"
};

firebase.initializeApp(firebaseConfig);
</script>
<script>
function adminLogin() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  firebase.auth().signInWithEmailAndPassword(email, password)
    .then((userCredential) => {
      window.location.href = "admin-dashboard.html";
    })
    .catch((error) => {
      document.getElementById("message").textContent = error.message;
    });
}
</script>

</body>
</html>
